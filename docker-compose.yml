services:
  backend:
    build:
      context: ./backend
    container_name: quranic-shazam-backend
    ports:
      - "8000:8000"
    environment:
      QD_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080"
      QD_EMBEDDINGS_PATH: "/app/data/reciters_embeddings.npy"
    volumes:
      # Persist embeddings + model caches across restarts
      - ./backend/data/reciters_embeddings.npy:/app/data/reciters_embeddings.npy
      - hf-cache:/app/.cache/huggingface
      - torch-cache:/app/.cache/torch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
    container_name: quranic-shazam-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf-cache:
  torch-cache:
