[project]
name = "quranic-shazam-backend"
version = "0.1.0"
description = "Quranic reciter identification API (FastAPI + SpeechBrain embeddings)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi>=0.111,<0.120",
  "uvicorn[standard]>=0.23",
  "python-multipart>=0.0.9",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "numpy<2",
  "scipy>=1.10",
  "torch>=2.1",
  "torchaudio>=2.1",
  "speechbrain==0.5.13",
  "huggingface-hub<0.26",
  "pydub>=0.25.1",
  "soundfile>=0.12",
  "requests>=2.31",
  "tqdm>=4.66",
  "torchcodec==0.8.1",
  "onnxruntime<1.21",
  "faster-whisper<1.2",
  "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.4",
]

[project.scripts]
qd-generate-data = "scripts.generate_data:main"
qd-extract-embeddings = "scripts.extract_embeddings:main"
qd-evaluate = "scripts.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
