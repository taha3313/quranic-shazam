name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend test dependencies
        run: uv sync --frozen --no-default-groups --group dev

      - name: Run backend unit and integration tests
        run: uv run --frozen pytest -q

      - name: Lint backend
        run: uv run --frozen ruff check app scripts tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  render-deploy:
    name: Deploy ${{ matrix.component }} to Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_HOOKS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            hook_secret: RENDER_FRONTEND_DEPLOY_HOOK_URL
          - component: backend
            hook_secret: RENDER_BACKEND_DEPLOY_HOOK_URL
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Request deployment of tested commit
        env:
          COMPONENT: ${{ matrix.component }}
          BEFORE_SHA: ${{ github.event.before }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets[matrix.hook_secret] }}
        run: python3 .github/scripts/render_deploy.py
